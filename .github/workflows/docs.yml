# .github/workflows/docs.yml
name: Deploy TypeDoc to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the permissions the workflow needs
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npx typedoc   # or: npm run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs   # must match "out" in your typedoc config

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5